version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: doggy_postgres
    restart: always
    environment:
      POSTGRES_USER: doggys
      POSTGRES_PASSWORD: doggys
      POSTGRES_DB: doggy_saas
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: doggy_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data:
